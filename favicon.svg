<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- A magnifying glass over an envelope. Shipped as a file rather than a
       data: URI so the Content-Security-Policy can keep img-src at 'self':
       allowing data: for a favicon would allow it everywhere. -->
  <rect width="16" height="16" rx="3" fill="#1f4b8e"/>
  <path d="M3 5.5h7v5H3z" fill="none" stroke="#fff" stroke-width="1.1"/>
  <path d="M3 5.5l3.5 3 3.5-3" fill="none" stroke="#fff" stroke-width="1.1"/>
  <circle cx="11" cy="10" r="2.6" fill="none" stroke="#fff" stroke-width="1.3"/>
  <path d="M12.9 11.9L14.6 13.6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
</svg>
